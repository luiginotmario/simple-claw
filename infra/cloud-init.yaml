#cloud-config

# OpenClaw Instance Auto-Configuration (Life OS Secure Fork)
# SECURITY PATCH APPLIED: insecure_auth_disabled
# Users access everything via web dashboard (Nginx -> Loopback -> Gateway)

# Set root password (injected dynamically)
chpasswd:
    list: |
        root:YOUR_PASSWORD_HERE
    expire: false

package_update: true
package_upgrade: true

packages:
    - git
    - curl
    - wget
    - vim
    - htop
    - nginx
    - certbot
    - python3-certbot-nginx
    - ufw
    - ca-certificates
    - gnupg

runcmd:
    # Install Node.js 22 (required for OpenClaw)
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
    - apt-get update
    - apt-get install -y nodejs

    # Install OpenClaw globally
    - npm install -g openclaw@latest

    # Create openclaw user for running the service (User Isolation)
    - useradd -r -m -d /home/openclaw -s /bin/bash openclaw

    # Create OpenClaw directories and config
    - mkdir -p /home/openclaw/.openclaw

    # Generate gateway token and full OpenClaw config
    # Life OS provides ALL credentials - user does nothing
    - |
        TOKEN=$(openssl rand -hex 32)
        cat > /home/openclaw/.openclaw/openclaw.json << 'OCCONFIG'
        {
          "gateway": {
            "mode": "local",
            "auth": {
              "token": "GATEWAY_TOKEN_PLACEHOLDER"
            },
            "controlUi": {
              "allowInsecureAuth": false
            },
            "trustedProxies": ["127.0.0.1", "::1"]
          },
          "llm": {
            "provider": "openai",
            "apiKey": "OPENAI_KEY_PLACEHOLDER",
            "model": "gpt-4o-mini"
          },
          "agent": {
            "systemPrompt": "You are a helpful personal assistant with shopping superpowers. You can search for products, compare prices across 100+ retailers, track price changes over time, and provide direct purchase links. Start by asking the user their name and what they'd like you to help with. Be warm and conversational."
          },
          "skills": {
            "web_search": {
              "enabled": true
            },
            "price-tracker": {
              "enabled": true,
              "apiKey": "PRICESAPI_KEY_PLACEHOLDER"
            }
          },
          "tools": {
            "allow": ["group:web", "group:memory", "cron"]
          }
        }
        OCCONFIG
        
        # Replace placeholders (will be injected by provisioning script)
        sed -i "s/GATEWAY_TOKEN_PLACEHOLDER/$TOKEN/g" /home/openclaw/.openclaw/openclaw.json

    # Install price-tracker skill
    - mkdir -p /home/openclaw/.openclaw/skills/price-tracker
    - |
        cat > /home/openclaw/.openclaw/skills/price-tracker/SKILL.md << 'SKILLMD'
        ---
        name: price-tracker
        description: Search products, compare prices across retailers, track price changes over time, and provide purchase links using PricesAPI.
        metadata: {"openclaw":{"requires":{"env":["PRICESAPI_KEY"]},"primaryEnv":"PRICESAPI_KEY"}}
        ---

        ## Price Tracker & Shopping Assistant

        You can help users find the best deals, compare prices, and track price changes over time.

        ### Searching for Products

        When a user asks to find, search for, or buy a product, use `web_fetch` to search PricesAPI:

            web_fetch({ url: "https://api.pricesapi.io/api/v1/products/search?q=USER_QUERY&limit=5&api_key=${PRICESAPI_KEY}" })

        Replace USER_QUERY with the URL-encoded product name the user is looking for.

        Parse the JSON response. The response has this structure:
        - `success`: boolean
        - `data.query`: the search term
        - `data.results`: array of products, each with `id`, `title`, `image`, `offerCount`
        - `data.total`: total number of results

        ### Getting Price Offers

        Once you have a product ID from search results, fetch current offers from retailers:

            web_fetch({ url: "https://api.pricesapi.io/api/v1/products/PRODUCT_ID/offers?country=us&api_key=${PRICESAPI_KEY}" })

        Replace PRODUCT_ID with the numeric product ID. Note: this endpoint performs real-time scraping and may take 5-30 seconds.

        Each offer in `data.offers` includes:
        - `seller`: retailer name
        - `price`: numeric price
        - `currency`: currency code
        - `url`: direct purchase link to the retailer
        - `rating`: seller rating
        - `stock`: availability status
        - `delivery`: shipping information

        Present results ranked cheapest first with seller name, price, stock status, and direct purchase link.

        ### Price History Tracking

        When a user asks to track a product price or asks if now is a good time to buy:
        1. Fetch current offers
        2. Store a price snapshot in memory: product name, ID, date, lowest price, seller
        3. Optionally set up a cron job to re-check daily

        When asked about price trends:
        1. Search memory for previous snapshots of that product
        2. Compare current vs historical prices
        3. Advise: price dropped/stable/increased with percentage and recommendation

        ### Supported Countries

        Use the `country` parameter: US, CA, BR, MX, UK, DE, FR, IT, ES, NL, SE, PL, AU, JP, IN, SG, AE, SA. Default: us.
        SKILLMD

    - chown -R openclaw:openclaw /home/openclaw

    # Create systemd service for OpenClaw (system-level for always-on)
    # Binds STRICTLY to loopback (127.0.0.1), preventing external IP access
    - |
        cat > /etc/systemd/system/openclaw-gateway.service <<'SYSTEMD'
        [Unit]
        Description=OpenClaw Gateway
        After=network.target

        [Service]
        Type=simple
        User=openclaw
        Group=openclaw
        WorkingDirectory=/home/openclaw
        Environment=HOME=/home/openclaw
        Environment=NODE_ENV=production
        Environment=PRICESAPI_KEY=PRICESAPI_KEY_PLACEHOLDER
        ExecStart=/usr/bin/openclaw gateway --port 18789 --bind loopback
        Restart=always
        RestartSec=10

        [Install]
        WantedBy=multi-user.target
        SYSTEMD

    # Enable and start OpenClaw service
    - systemctl daemon-reload
    - systemctl enable openclaw-gateway
    - systemctl start openclaw-gateway

    # Configure firewall (Network Isolation)
    # Only allow SSH, HTTP, HTTPS. OpenClaw port 18789 is BLOCKED from outside.
    - ufw allow 22/tcp
    - ufw allow 80/tcp
    - ufw allow 443/tcp
    - ufw --force enable

    # Create Nginx reverse proxy config for OpenClaw dashboard
    - |
        cat > /etc/nginx/sites-available/openclaw <<'NGINX'
        server {
            listen 80 default_server;
            listen [::]:80 default_server;
            server_name _;

            # OpenClaw Dashboard & API (WebSocket support for real-time updates)
            location / {
                proxy_pass http://127.0.0.1:18789;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection 'upgrade';
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_cache_bypass $http_upgrade;
                proxy_read_timeout 86400;
                proxy_send_timeout 86400;
            }
        }
        NGINX

    # Enable the site and start Nginx
    - ln -sf /etc/nginx/sites-available/openclaw /etc/nginx/sites-enabled/
    - rm -f /etc/nginx/sites-enabled/default
    - nginx -t && systemctl reload nginx
    - systemctl enable nginx

final_message: 'Life OS Secured Instance ready! Access dashboard at http://<ip>/'
